<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God of War Profile</title>
  <style>
    :root {
      --bg: #080b10;
      --panel: rgba(18, 20, 24, 0.96);
      --text: #f3f2ef;
      --muted: #9a958f;
      --accent: #d94127;
      --accent-2: #c3ad7b;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 34px 100px rgba(0, 0, 0, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, rgba(217,65,39,0.08), transparent 14%),
                  linear-gradient(180deg, #111317 0%, #07080c 100%);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 18%);
      pointer-events: none;
      z-index: 0;
    }

    .sky {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 22% 20%, rgba(232, 152, 115, 0.12), transparent 18%),
                        radial-gradient(circle at 74% 26%, rgba(195, 173, 123, 0.1), transparent 16%);
      z-index: 0;
    }

    .ember {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217,65,39,0.85), transparent 55%);
      filter: blur(1px);
      opacity: 0;
      animation: emberRise 4s infinite ease-in;
      z-index: 1;
    }
    .ember:nth-child(1) { left: 10%; top: 60%; animation-delay: 0.2s; }
    .ember:nth-child(2) { left: 36%; top: 68%; animation-delay: 1.1s; }
    .ember:nth-child(3) { left: 62%; top: 58%; animation-delay: 1.9s; }

    @keyframes emberRise {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      15% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-180px) scale(1.3); }
    }

    .layout {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 80px 24px 32px;
      position: relative;
      z-index: 2;
    }

    .profile-card {
      background: rgba(18, 20, 24, 0.98);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: var(--shadow);
      padding: 44px;
      position: relative;
      overflow: hidden;
    }

    .profile-card::after {
      content: 'RAGNAROK';
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 4rem;
      color: rgba(217,65,39,0.08);
      z-index: 0;
    }

    .profile-card h1 {
      margin: 0 0 16px;
      font-size: clamp(2.4rem, 4vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: 0.08em;
      color: var(--text);
      position: relative;
      z-index: 1;
    }

    .profile-card p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.75;
      font-size: 0.96rem;
      position: relative;
      z-index: 1;
    }

    .profile-panel {
      display: grid;
      gap: 18px;
      margin-bottom: 34px;
      position: relative;
      z-index: 1;
    }

    .profile-panel div {
      padding: 20px;
      border-radius: 24px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .profile-panel span {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 6px;
    }

    .profile-panel strong {
      color: var(--text);
      font-size: 1rem;
      line-height: 1.4;
    }

    .button {
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 22px;
      background: linear-gradient(135deg, #d94127, #c3ad7b);
      color: #111;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      z-index: 1;
    }

    .button:hover { transform: translateY(-2px); box-shadow: 0 22px 40px rgba(217,65,39,0.22); }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 720px) { .layout { padding: 54px 16px 24px; } .profile-card { padding: 32px; } }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="ember"></div>
  <div class="ember"></div>
  <div class="ember"></div>
  <main class="layout" aria-label="Profile page">
    <div class="profile-card">
      <h1 id="profileTitle">Welcome back!</h1>
      <p id="profileSubtitle">Your house stands ready in the storm. Continue the journey from the battlefield.</p>
      <div class="profile-panel">
        <div>
          <span>Email</span>
          <strong id="profileEmail">loading...</strong>
        </div>
        <div>
          <span>Account type</span>
          <strong>Local demo account</strong>
        </div>
      </div>
      <button class="button" id="logoutButton" type="button">Leave the Keep</button>
      <p class="note">This profile page keeps your session in browser local storage while keeping the theme cinematic and dramatic.</p>
    </div>
  </main>
  <script>
    const activeEmail = localStorage.getItem('authActiveUser');
    const accounts = JSON.parse(localStorage.getItem('authAccounts') || '[]');
    const account = accounts.find(item => item.email === activeEmail);

    if (!activeEmail || !account) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('profileTitle').textContent = `Welcome back, ${account.name}!`;
      document.getElementById('profileEmail').textContent = account.email;
      document.getElementById('profileSubtitle').textContent = 'Your identity is verified — rule the realm with fierce resolve.';
    }

    document.getElementById('logoutButton').addEventListener('click', () => {
      localStorage.removeItem('authActiveUser');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
